[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnxtrace"
version = "0.1.0"
description = "Host-side QNX target log/trace analyzer + test harness CLI"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
qnxtrace = "qnxtrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
